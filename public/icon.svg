<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="jh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7867" />
      <stop offset="50%" stop-color="#0A5C4F" />
      <stop offset="100%" stop-color="#063D34" />
    </linearGradient>
    <filter id="jh-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect width="512" height="512" rx="120" fill="url(#jh-grad)" />

  <!-- Subtle Inner Border for High-Definition Contrast -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Medical Cross Graphic -->
  <g filter="url(#jh-shadow)">
    <!-- Horizontal Cross Bar -->
    <rect x="100" y="206" width="312" height="100" rx="28" fill="#FFFFFF" />
    <!-- Vertical Cross Bar -->
    <rect x="206" y="100" width="100" height="312" rx="28" fill="#FFFFFF" />
  </g>

  <!-- Center Core Accent: Emerald Diamond/Heart Dot for Healthcare Identity -->
  <circle cx="256" cy="256" r="22" fill="#0A5C4F" />
</svg>