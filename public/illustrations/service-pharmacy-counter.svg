<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop Card -->
  <rect x="15" y="15" width="470" height="320" rx="28" fill="#EBF6F2" stroke="#D1E8DF" stroke-width="2" />
  
  <!-- Subtle Organic Wave in Background -->
  <path d="M 15 240 C 130 200, 240 270, 360 215 C 410 190, 450 215, 485 205 L 485 335 L 15 335 Z" fill="#E0F3EC" opacity="0.7" />

  <!-- Pharmacy Shelves in Background -->
  <g transform="translate(60, 50)">
    <!-- Shelf 1 -->
    <rect x="0" y="55" width="380" height="8" rx="3" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="2" />
    <!-- Shelf 1 Medicines -->
    <!-- Bottle 1 -->
    <rect x="25" y="15" width="24" height="40" rx="4" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <rect x="28" y="8" width="18" height="8" rx="2" fill="#0A5C4F" />
    <rect x="27" y="24" width="20" height="18" rx="2" fill="#E0F3EC" />
    <line x1="31" y1="33" x2="43" y2="33" stroke="#0A5C4F" stroke-width="2" />
    <!-- Bottle 2 (Taller) -->
    <rect x="60" y="5" width="30" height="50" rx="5" fill="#149E86" stroke="#0A5C4F" stroke-width="2" />
    <rect x="66" y="-2" width="18" height="8" rx="2" fill="#FFFFFF" />
    <rect x="64" y="16" width="22" height="24" rx="2" fill="#FFFFFF" />
    <path d="M 75 22 L 75 34 M 69 28 L 81 28" stroke="#0A5C4F" stroke-width="2.5" stroke-linecap="round" />
    <!-- Pill Box 1 -->
    <rect x="105" y="20" width="45" height="35" rx="4" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <rect x="105" y="20" width="45" height="10" rx="2" fill="#75BCA5" />
    <line x1="112" y1="38" x2="140" y2="38" stroke="#A9DCCB" stroke-width="2" />
    <line x1="112" y1="45" x2="135" y2="45" stroke="#A9DCCB" stroke-width="2" />
    <!-- Pill Box 2 -->
    <rect x="160" y="12" width="40" height="43" rx="4" fill="#E8F6F1" stroke="#0A5C4F" stroke-width="2" />
    <line x1="168" y1="26" x2="192" y2="26" stroke="#0A5C4F" stroke-width="2" />
    <line x1="168" y1="34" x2="190" y2="34" stroke="#0A5C4F" stroke-width="2" />
    <circle cx="180" cy="45" r="4" fill="#149E86" />

    <!-- Pharmacy Green Cross Symbol in Center Shelf -->
    <g transform="translate(225, 0)">
      <circle cx="25" cy="25" r="24" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2.5" />
      <path d="M 25 12 L 25 38 M 12 25 L 38 25" stroke="#0A5C4F" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- More Bottles on Right -->
    <rect x="290" y="18" width="26" height="37" rx="4" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <rect x="294" y="10" width="18" height="8" rx="2" fill="#75BCA5" />
    <rect x="325" y="8" width="28" height="47" rx="5" fill="#E8F6F1" stroke="#0A5C4F" stroke-width="2" />
    <rect x="330" y="0" width="18" height="8" rx="2" fill="#0A5C4F" />
  </g>

  <!-- Foreground Pharmacy Counter -->
  <!-- Counter Shadow -->
  <ellipse cx="250" cy="305" rx="195" ry="14" fill="#0A5C4F" opacity="0.12" />
  <!-- Counter Top -->
  <path d="M 50 200 L 450 200 L 465 218 L 35 218 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
  <!-- Counter Front Panel -->
  <path d="M 40 218 L 460 218 L 450 300 L 50 300 Z" fill="#D5EBE2" stroke="#0A5C4F" stroke-width="3" />
  <!-- Inset decorative panel on counter -->
  <rect x="120" y="226" width="260" height="60" rx="8" fill="#E8F6F1" stroke="#A9DCCB" stroke-width="2" />
  <text x="250" y="262" text-anchor="middle" fill="#0A5C4F" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="3">PHARMACY / दवाखाना</text>

  <!-- Centerpiece: Mortar and Pestle (Classic Apothecary Symbol) -->
  <g transform="translate(140, 140)">
    <!-- Mortar Bowl -->
    <path d="M 15 35 C 15 55, 30 70, 50 70 C 70 70, 85 55, 85 35 L 85 30 L 15 30 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3.5" />
    <!-- Mortar Base -->
    <path d="M 32 70 L 68 70 L 72 76 L 28 76 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
    <!-- Pestle -->
    <path d="M 65 10 L 80 18 L 50 50 L 42 45 Z" fill="#75BCA5" stroke="#0A5C4F" stroke-width="3" />
    <!-- Mortar Cross -->
    <path d="M 50 42 L 50 56 M 43 49 L 57 49" stroke="#149E86" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Left: Blister Pack of Capsules -->
  <g transform="translate(65, 155) rotate(-8)">
    <rect x="0" y="0" width="55" height="42" rx="5" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <!-- 6 Capsule pockets -->
    <ellipse cx="14" cy="12" rx="7" ry="5" fill="#0A5C4F" />
    <ellipse cx="28" cy="12" rx="7" ry="5" fill="#149E86" />
    <ellipse cx="42" cy="12" rx="7" ry="5" fill="#0A5C4F" />
    <ellipse cx="14" cy="30" rx="7" ry="5" fill="#149E86" />
    <ellipse cx="28" cy="30" rx="7" ry="5" fill="#0A5C4F" />
    <ellipse cx="42" cy="30" rx="7" ry="5" fill="#149E86" />
  </g>

  <!-- Right: Syrup Bottle & Dropper -->
  <g transform="translate(330, 130)">
    <!-- Medicine Bottle -->
    <rect x="25" y="25" width="40" height="65" rx="7" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
    <rect x="33" y="14" width="24" height="12" rx="3" fill="#0A5C4F" />
    <!-- Label -->
    <rect x="29" y="38" width="32" height="35" rx="3" fill="#EBF6F2" stroke="#A9DCCB" stroke-width="1.5" />
    <path d="M 45 47 L 45 59 M 39 53 L 51 53" stroke="#0A5C4F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="34" y1="65" x2="48" y2="65" stroke="#75BCA5" stroke-width="2" stroke-linecap="round" />
    <!-- Dropper / Syringe leaning beside -->
    <g transform="translate(0, 15) rotate(-20)">
      <rect x="0" y="0" width="10" height="50" rx="4" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
      <circle cx="5" cy="-2" r="5" fill="#75BCA5" stroke="#0A5C4F" stroke-width="1.5" />
      <line x1="5" y1="10" x2="5" y2="40" stroke="#149E86" stroke-width="2" />
      <line x1="2" y1="18" x2="5" y2="18" stroke="#0A5C4F" stroke-width="1.5" />
      <line x1="2" y1="26" x2="5" y2="26" stroke="#0A5C4F" stroke-width="1.5" />
      <line x1="2" y1="34" x2="5" y2="34" stroke="#0A5C4F" stroke-width="1.5" />
    </g>
  </g>
</svg>
