<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop Card -->
  <rect x="15" y="15" width="470" height="320" rx="28" fill="#EBF6F2" stroke="#D1E8DF" stroke-width="2" />
  
  <!-- Subtle Organic Wave in Background -->
  <path d="M 15 250 C 130 200, 240 270, 360 215 C 410 190, 450 215, 485 205 L 485 335 L 15 335 Z" fill="#E0F3EC" opacity="0.7" />

  <!-- Wall Heartbeat ECG Line -->
  <path d="M 35 120 L 95 120 L 110 85 L 130 160 L 145 105 L 160 125 L 175 120 L 465 120" stroke="#149E86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Emergency Room Sign (Top Left) -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="145" height="36" rx="8" fill="#0A5C4F" />
    <circle cx="20" cy="18" r="10" fill="#E8F6F1" />
    <path d="M 20 12 L 20 24 M 14 18 L 26 18" stroke="#0A5C4F" stroke-width="3" stroke-linecap="round" />
    <text x="38" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="11" letter-spacing="1">24/7 EMERGENCY</text>
  </g>

  <!-- Left: Medical Oxygen Cylinder with Pressure Regulator Gauge -->
  <g transform="translate(65, 120)">
    <!-- Shadow -->
    <ellipse cx="25" cy="185" rx="22" ry="7" fill="#0A5C4F" opacity="0.15" />
    <!-- Cylinder Body -->
    <rect x="8" y="40" width="34" height="140" rx="17" fill="#0A5C4F" stroke="#074B40" stroke-width="2" />
    <!-- Top shoulder -->
    <path d="M 8 57 C 8 45, 15 35, 25 35 C 35 35, 42 45, 42 57 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />
    <!-- Oxygen 'O2' Text -->
    <text x="25" y="115" text-anchor="middle" fill="#7CE4C9" font-family="system-ui, sans-serif" font-weight="900" font-size="16">O₂</text>
    <text x="25" y="132" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="8" letter-spacing="1">MEDICAL</text>
    
    <!-- Pressure Valve & Regulator Gauge -->
    <rect x="21" y="18" width="8" height="18" fill="#75BCA5" stroke="#0A5C4F" stroke-width="1.5" />
    <circle cx="34" cy="22" r="9" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <line x1="34" y1="22" x2="38" y2="18" stroke="#0A5C4F" stroke-width="2" stroke-linecap="round" />
    <path d="M 17 26 C 10 26, 6 32, 10 40 L 10 65" stroke="#75BCA5" stroke-width="2" fill="none" />
  </g>

  <!-- Centerpiece: Emergency Trauma Examination / Stretcher Bed -->
  <g transform="translate(135, 140)">
    <!-- Bed Shadow -->
    <ellipse cx="140" cy="165" rx="145" ry="14" fill="#0A5C4F" opacity="0.12" />

    <!-- Bed Legs & Locking Wheels -->
    <rect x="35" y="90" width="8" height="65" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="2" />
    <rect x="235" y="90" width="8" height="65" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="2" />
    <!-- Horizontal Crossbar -->
    <rect x="35" y="125" width="208" height="6" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="1.5" />
    <!-- Wheels -->
    <circle cx="39" cy="158" r="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2.5" />
    <circle cx="39" cy="158" r="3" fill="#0A5C4F" />
    <circle cx="239" cy="158" r="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2.5" />
    <circle cx="239" cy="158" r="3" fill="#0A5C4F" />

    <!-- Mattress Frame -->
    <rect x="15" y="70" width="250" height="25" rx="6" fill="#0A5C4F" />
    <!-- Mattress Cushion (Clean Clinical Mint) -->
    <rect x="20" y="55" width="240" height="20" rx="6" fill="#FFFFFF" stroke="#C0DBD1" stroke-width="2" />
    
    <!-- Elevated Headrest Section -->
    <g transform="translate(20, 25) rotate(-16)">
      <rect x="0" y="20" width="75" height="18" rx="5" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
      <!-- Pillow -->
      <rect x="10" y="12" width="45" height="15" rx="6" fill="#E0F3EC" stroke="#A9DCCB" stroke-width="1.5" />
    </g>

    <!-- Side Safety Rail -->
    <path d="M 90 45 L 210 45 L 210 70 M 90 70 L 90 45 M 130 45 L 130 70 M 170 45 L 170 70" stroke="#75BCA5" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right: Emergency Vital Signs Monitor Stand -->
  <g transform="translate(390, 80)">
    <!-- Stand Pole -->
    <rect x="28" y="70" width="6" height="180" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="2" />
    <!-- Base -->
    <ellipse cx="31" cy="250" rx="30" ry="7" fill="#0A5C4F" opacity="0.2" />
    <path d="M 6 248 L 56 248" stroke="#0A5C4F" stroke-width="4" stroke-linecap="round" />

    <!-- Monitor Unit -->
    <rect x="0" y="0" width="62" height="70" rx="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
    <rect x="6" y="6" width="50" height="42" rx="4" fill="#0A5C4F" />
    <!-- ECG Wave on screen -->
    <path d="M 8 26 L 18 26 L 22 14 L 28 36 L 34 22 L 38 28 L 54 28" stroke="#7CE4C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Heart rate display -->
    <text x="12" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="10">80</text>
    <text x="30" y="42" fill="#7CE4C9" font-family="system-ui, sans-serif" font-weight="700" font-size="7">BPM</text>
    
    <!-- Monitor Control Buttons -->
    <circle cx="16" cy="58" r="3" fill="#149E86" />
    <circle cx="31" cy="58" r="3" fill="#75BCA5" />
    <circle cx="46" cy="58" r="3" fill="#0A5C4F" />
  </g>
</svg>
