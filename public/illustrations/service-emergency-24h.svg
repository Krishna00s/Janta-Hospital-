<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop Card -->
  <rect x="15" y="15" width="470" height="320" rx="28" fill="#EBF6F2" stroke="#D1E8DF" stroke-width="2" />
  
  <!-- Subtle Organic Wave in Background -->
  <path d="M 15 220 C 120 180, 220 280, 340 210 C 400 180, 440 220, 485 200 L 485 335 L 15 335 Z" fill="#E0F3EC" opacity="0.7" />

  <!-- Emergency Heartbeat ECG Rhythm Line -->
  <path d="M 35 175 L 110 175 L 130 135 L 155 220 L 175 160 L 195 185 L 210 175 L 465 175" stroke="#149E86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Centerpiece: Emergency Medical First-Aid Kit -->
  <g transform="translate(180, 75)">
    <!-- Shadow -->
    <ellipse cx="70" cy="190" rx="80" ry="14" fill="#0A5C4F" opacity="0.12" />
    
    <!-- Bag Handle -->
    <path d="M 45 40 C 45 15, 95 15, 95 40" stroke="#0A5C4F" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 45 40 C 45 20, 95 20, 95 40" stroke="#75BCA5" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Main Medical Case Body -->
    <rect x="0" y="35" width="140" height="150" rx="18" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="5" />
    
    <!-- Top Lid Section -->
    <path d="M 0 53 C 0 43, 8 35, 18 35 L 122 35 C 132 35, 140 43, 140 53 L 140 75 L 0 75 Z" fill="#F4FAF7" stroke="#0A5C4F" stroke-width="4" />
    
    <!-- Latches -->
    <rect x="25" y="68" width="16" height="14" rx="3" fill="#75BCA5" stroke="#0A5C4F" stroke-width="2" />
    <rect x="99" y="68" width="16" height="14" rx="3" fill="#75BCA5" stroke="#0A5C4F" stroke-width="2" />

    <!-- Prominent Medical Cross on Kit -->
    <circle cx="70" cy="125" r="32" fill="#E8F6F1" stroke="#A9DCCB" stroke-width="2" />
    <path d="M 70 105 L 70 145 M 50 125 L 90 125" stroke="#0A5C4F" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Left: First-Aid Stethoscope -->
  <g transform="translate(60, 110)">
    <!-- Curving tube -->
    <path d="M 70 150 C 40 180, 10 140, 20 80 C 25 50, 60 50, 65 80 C 70 110, 40 150, 75 165 L 105 170" stroke="#0A5C4F" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Chest piece -->
    <circle cx="112" cy="170" r="14" fill="#75BCA5" stroke="#0A5C4F" stroke-width="3" />
    <circle cx="112" cy="170" r="7" fill="#E0F3EC" />
    <!-- Earpieces -->
    <path d="M 28 55 C 20 40, 30 20, 42 22" stroke="#75BCA5" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 52 55 C 60 40, 50 20, 38 22" stroke="#75BCA5" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right: 24-Hour Emergency Badge -->
  <g transform="translate(340, 80)">
    <circle cx="45" cy="45" r="42" fill="#0A5C4F" />
    <circle cx="45" cy="45" r="36" fill="#0A5C4F" stroke="#7CE4C9" stroke-width="2" stroke-dasharray="5 3" />
    <text x="45" y="42" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="22">24/7</text>
    <text x="45" y="60" text-anchor="middle" fill="#7CE4C9" font-family="system-ui, sans-serif" font-weight="800" font-size="10" letter-spacing="1.5">EMERGENCY</text>
  </g>

  <!-- Pill Bottle & Syringe Accent (Bottom Right) -->
  <g transform="translate(350, 205)">
    <!-- Antiseptic / Medicine bottle -->
    <rect x="0" y="20" width="34" height="50" rx="6" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
    <rect x="5" y="10" width="24" height="12" rx="3" fill="#149E86" />
    <path d="M 17 38 L 17 52 M 10 45 L 24 45" stroke="#149E86" stroke-width="3" stroke-linecap="round" />
    <!-- Clinical Thermometer -->
    <g transform="translate(45, 10) rotate(25)">
      <rect x="0" y="0" width="10" height="55" rx="5" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2.5" />
      <circle cx="5" cy="50" r="7" fill="#149E86" stroke="#0A5C4F" stroke-width="2" />
      <line x1="5" y1="15" x2="5" y2="45" stroke="#149E86" stroke-width="2.5" />
      <line x1="2" y1="20" x2="5" y2="20" stroke="#0A5C4F" stroke-width="1.5" />
      <line x1="2" y1="28" x2="5" y2="28" stroke="#0A5C4F" stroke-width="1.5" />
      <line x1="2" y1="36" x2="5" y2="36" stroke="#0A5C4F" stroke-width="1.5" />
    </g>
  </g>
</svg>
