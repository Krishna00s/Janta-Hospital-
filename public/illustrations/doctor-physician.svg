<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop -->
  <circle cx="200" cy="200" r="185" fill="#EBF7F2" />
  <circle cx="200" cy="200" r="160" fill="#E0F3EC" opacity="0.6" />
  <path d="M 90 280 C 130 240, 270 240, 310 280 C 330 300, 340 340, 340 390 L 60 390 C 60 340, 70 300, 90 280 Z" fill="#D0EBE1" opacity="0.4" />

  <!-- Stethoscope Behind Neck -->
  <path d="M 160 185 C 160 215, 240 215, 240 185" stroke="#0A5C4F" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Body / Shoulders (White Doctor's Coat) -->
  <path d="M 100 390 C 100 320, 130 260, 160 240 L 200 280 L 240 240 C 270 260, 300 320, 300 390 Z" fill="#FFFFFF" stroke="#D5E6DF" stroke-width="2" />
  
  <!-- Coat Left Flap & Right Flap -->
  <path d="M 100 390 C 100 320, 130 260, 175 240 L 195 390 Z" fill="#F8FCFA" />
  <path d="M 300 390 C 300 320, 270 260, 225 240 L 205 390 Z" fill="#EDF6F2" />
  
  <!-- Inner Medical Scrub (Teal) -->
  <path d="M 175 240 L 200 275 L 225 240 L 218 200 L 182 200 Z" fill="#149E86" />
  <!-- V-Neck shadow -->
  <path d="M 185 200 L 200 225 L 215 200 Z" fill="#0D7A68" opacity="0.4" />

  <!-- White Coat Lapels -->
  <path d="M 165 240 L 182 285 L 195 245 Z" fill="#FFFFFF" stroke="#C8DFD6" stroke-width="1.5" />
  <path d="M 235 240 L 218 285 L 205 245 Z" fill="#F0F7F4" stroke="#C8DFD6" stroke-width="1.5" />

  <!-- Coat Pocket with Pen -->
  <rect x="235" y="300" width="36" height="42" rx="4" fill="#FFFFFF" stroke="#D0E3DC" stroke-width="1.5" />
  <line x1="247" y1="292" x2="247" y2="304" stroke="#0A5C4F" stroke-width="3" stroke-linecap="round" />
  <circle x="247" y="290" r="2" fill="#0A5C4F" />

  <!-- Stethoscope Front Hang & Chest Piece -->
  <!-- Left tube -->
  <path d="M 162 185 C 160 230, 168 280, 185 305" stroke="#0A5C4F" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Right tube -->
  <path d="M 238 185 C 240 230, 230 270, 205 310 L 205 330" stroke="#0A5C4F" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Stethoscope Chest Piece -->
  <circle cx="205" cy="336" r="14" fill="#75BCA5" stroke="#0A5C4F" stroke-width="3" />
  <circle cx="205" cy="336" r="7" fill="#E0F3EC" />

  <!-- Neck -->
  <path d="M 182 175 L 182 215 C 182 225, 218 225, 218 215 L 218 175 Z" fill="#E8BFA0" />
  <path d="M 182 205 C 190 215, 210 215, 218 205 L 218 215 C 218 225, 182 225, 182 215 Z" fill="#D9AC8B" opacity="0.6" />

  <!-- Head (Faceless Silhouette - No Eyes, No Nose, No Mouth) -->
  <path d="M 160 140 C 160 185, 240 185, 240 140 C 240 95, 160 95, 160 140 Z" fill="#F0C7A8" />
  
  <!-- Ears -->
  <path d="M 158 135 C 154 135, 154 150, 158 150 Z" fill="#E5B896" />
  <path d="M 242 135 C 246 135, 246 150, 242 150 Z" fill="#E5B896" />

  <!-- Clean Professional Hair Silhouette -->
  <path d="M 158 135 C 155 110, 170 85, 200 85 C 230 85, 245 110, 242 135 C 238 105, 225 100, 200 100 C 175 100, 162 108, 158 135 Z" fill="#1C302B" />
  <path d="M 162 110 C 175 92, 210 90, 238 98 C 242 90, 230 82, 200 82 C 170 82, 158 98, 162 110 Z" fill="#25423B" />

  <!-- Stethoscope Earpieces -->
  <path d="M 158 145 C 150 155, 158 175, 164 185" stroke="#75BCA5" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 242 145 C 250 155, 242 175, 236 185" stroke="#75BCA5" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="158" cy="144" r="3" fill="#0A5C4F" />
  <circle cx="242" cy="144" r="3" fill="#0A5C4F" />

  <!-- Clinical Clipboard held on left side -->
  <g transform="translate(75, 275) rotate(-8)">
    <rect x="0" y="0" width="65" height="90" rx="6" fill="#0A5C4F" />
    <rect x="4" y="8" width="57" height="76" rx="4" fill="#FFFFFF" />
    <!-- Clip -->
    <rect x="20" y="-4" width="25" height="10" rx="3" fill="#75BCA5" stroke="#0A5C4F" stroke-width="1.5" />
    <!-- Medical Cross on Chart -->
    <path d="M 32 16 L 32 24 M 28 20 L 36 20" stroke="#149E86" stroke-width="2.5" stroke-linecap="round" />
    <!-- Chart lines -->
    <line x1="12" y1="30" x2="52" y2="30" stroke="#CBDDD6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="38" x2="48" y2="38" stroke="#CBDDD6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="46" x2="52" y2="46" stroke="#CBDDD6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="54" x2="40" y2="54" stroke="#CBDDD6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="62" x2="50" y2="62" stroke="#CBDDD6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="70" x2="35" y2="70" stroke="#CBDDD6" stroke-width="2.5" stroke-linecap="round" />
    <!-- Thumb holding clipboard -->
    <path d="M 60 45 C 65 45, 68 55, 62 60 C 58 60, 56 52, 56 48 Z" fill="#E5B896" />
  </g>

  <!-- Medical Cross Badge / Seal (Top Right) -->
  <g transform="translate(305, 50)">
    <circle cx="20" cy="20" r="22" fill="#FFFFFF" stroke="#A9DCCB" stroke-width="2" />
    <circle cx="20" cy="20" r="18" fill="#E8F6F1" />
    <path d="M 20 10 L 20 30 M 10 20 L 30 20" stroke="#0A5C4F" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
