<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop Card -->
  <rect x="15" y="15" width="470" height="320" rx="28" fill="#EBF6F2" stroke="#D1E8DF" stroke-width="2" />
  
  <!-- Subtle Organic Wave in Background -->
  <path d="M 15 240 C 130 190, 250 270, 360 210 C 410 180, 450 215, 485 205 L 485 335 L 15 335 Z" fill="#E0F3EC" opacity="0.7" />

  <!-- Pharmacy Wall Shelves with Organized Medicine Stock -->
  <g transform="translate(60, 45)">
    <!-- Main Frame -->
    <rect x="0" y="0" width="380" height="150" rx="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
    <!-- Dividers -->
    <line x1="125" y1="0" x2="125" y2="150" stroke="#0A5C4F" stroke-width="2" />
    <line x1="255" y1="0" x2="255" y2="150" stroke="#0A5C4F" stroke-width="2" />
    <line x1="0" y1="50" x2="380" y2="50" stroke="#0A5C4F" stroke-width="2" />
    <line x1="0" y1="100" x2="380" y2="100" stroke="#0A5C4F" stroke-width="2" />

    <!-- Compartment 1: Bottles -->
    <rect x="15" y="12" width="18" height="30" rx="3" fill="#149E86" />
    <rect x="40" y="8" width="22" height="34" rx="4" fill="#E0F3EC" stroke="#0A5C4F" stroke-width="1.5" />
    <rect x="70" y="15" width="16" height="27" rx="3" fill="#75BCA5" />
    <rect x="94" y="10" width="20" height="32" rx="3" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />

    <!-- Compartment 2: Central Green Cross Badge -->
    <rect x="135" y="10" width="110" height="30" rx="4" fill="#E8F6F1" />
    <circle cx="190" cy="25" r="14" fill="#0A5C4F" />
    <path d="M 190 17 L 190 33 M 182 25 L 198 25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Compartment 3: Medicine Boxes -->
    <rect x="268" y="16" width="30" height="26" rx="3" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />
    <rect x="305" y="10" width="28" height="32" rx="3" fill="#A9DCCB" />
    <rect x="340" y="14" width="25" height="28" rx="3" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />

    <!-- Row 2 Compartments -->
    <!-- Antibiotics / Syrups -->
    <rect x="12" y="62" width="24" height="32" rx="4" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />
    <rect x="44" y="58" width="20" height="36" rx="3" fill="#0A5C4F" />
    <rect x="72" y="64" width="22" height="30" rx="3" fill="#E0F3EC" />
    <!-- Blister Pack Rows -->
    <rect x="140" y="65" width="45" height="28" rx="3" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />
    <line x1="145" y1="74" x2="180" y2="74" stroke="#149E86" stroke-width="2" />
    <line x1="145" y1="82" x2="180" y2="82" stroke="#149E86" stroke-width="2" />
    
    <rect x="195" y="65" width="45" height="28" rx="3" fill="#E8F6F1" stroke="#0A5C4F" stroke-width="1.5" />
    <line x1="200" y1="74" x2="235" y2="74" stroke="#0A5C4F" stroke-width="2" />
    <line x1="200" y1="82" x2="235" y2="82" stroke="#0A5C4F" stroke-width="2" />

    <!-- Dressings & Bandages shelf -->
    <circle cx="280" cy="78" r="14" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <rect x="305" y="64" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />
    <rect x="342" y="60" width="26" height="34" rx="3" fill="#75BCA5" />
  </g>

  <!-- Dispensing Front Porch Counter -->
  <!-- Shadow -->
  <ellipse cx="250" cy="305" rx="195" ry="14" fill="#0A5C4F" opacity="0.12" />
  <!-- Counter Top -->
  <path d="M 50 190 L 450 190 L 465 212 L 35 212 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
  <!-- Counter Front -->
  <path d="M 40 212 L 460 212 L 450 300 L 50 300 Z" fill="#D5EBE2" stroke="#0A5C4F" stroke-width="3" />
  
  <!-- Signboard on Counter Front -->
  <rect x="130" y="225" width="240" height="60" rx="8" fill="#0A5C4F" />
  <text x="250" y="252" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="2">DISPENSARY / दवाई काउंटर</text>
  <text x="250" y="272" text-anchor="middle" fill="#7CE4C9" font-family="system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="1">GENUINE MEDICINES • ON-SITE</text>

  <!-- Items on Dispensing Counter -->
  <!-- Medicine Basket / Prescription Tray -->
  <g transform="translate(90, 150)">
    <rect x="0" y="10" width="75" height="35" rx="6" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <!-- Medicines inside basket -->
    <rect x="10" y="0" width="18" height="28" rx="3" fill="#149E86" />
    <rect x="32" y="4" width="15" height="24" rx="3" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="1.5" />
    <rect x="50" y="-2" width="16" height="30" rx="3" fill="#75BCA5" />
  </g>

  <!-- Pharmacist Mortar & Pestle on Counter (Right) -->
  <g transform="translate(340, 145)">
    <path d="M 10 25 C 10 42, 22 55, 40 55 C 58 55, 70 42, 70 25 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="3" />
    <path d="M 22 55 L 58 55 L 62 60 L 18 60 Z" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2.5" />
    <path d="M 50 5 L 62 12 L 38 38 L 32 34 Z" fill="#75BCA5" stroke="#0A5C4F" stroke-width="2.5" />
    <circle cx="40" cy="38" r="4" fill="#0A5C4F" />
  </g>
</svg>
