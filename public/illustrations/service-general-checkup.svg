<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop Card -->
  <rect x="15" y="15" width="470" height="320" rx="28" fill="#EBF6F2" stroke="#D1E8DF" stroke-width="2" />
  
  <!-- Subtle Organic Wave in Background -->
  <path d="M 15 240 C 130 200, 240 270, 360 215 C 410 190, 450 215, 485 205 L 485 335 L 15 335 Z" fill="#E0F3EC" opacity="0.7" />

  <!-- Centerpiece: Blood Pressure Monitor (Sphygmomanometer) with Digital Display -->
  <g transform="translate(190, 90)">
    <!-- Monitor Shadow -->
    <ellipse cx="60" cy="180" rx="75" ry="14" fill="#0A5C4F" opacity="0.12" />

    <!-- Main Unit -->
    <rect x="0" y="30" width="120" height="145" rx="18" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="4" />
    <!-- Screen Bezel -->
    <rect x="15" y="45" width="90" height="75" rx="8" fill="#F4FAF7" stroke="#A9DCCB" stroke-width="2" />
    
    <!-- Digital Readings (SYS / DIA / PULSE) -->
    <text x="30" y="70" fill="#0A5C4F" font-family="system-ui, sans-serif" font-weight="900" font-size="20">120</text>
    <text x="75" y="68" fill="#475B57" font-family="system-ui, sans-serif" font-weight="700" font-size="8">SYS</text>
    
    <text x="30" y="95" fill="#0A5C4F" font-family="system-ui, sans-serif" font-weight="900" font-size="18">80</text>
    <text x="75" y="93" fill="#475B57" font-family="system-ui, sans-serif" font-weight="700" font-size="8">DIA</text>
    
    <path d="M 28 108 L 32 104 L 36 112 L 40 106 L 44 110 L 48 108" stroke="#149E86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="112" fill="#149E86" font-family="system-ui, sans-serif" font-weight="800" font-size="12">72</text>
    <text x="75" y="111" fill="#475B57" font-family="system-ui, sans-serif" font-weight="700" font-size="7">PULSE</text>

    <!-- Start / Stop Button -->
    <rect x="35" y="132" width="50" height="24" rx="12" fill="#0A5C4F" />
    <text x="60" y="148" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="1">START</text>

    <!-- Air Tube connecting to Cuff -->
    <path d="M 120 120 C 170 120, 160 170, 190 170 L 220 170" stroke="#0A5C4F" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Blood Pressure Arm Cuff (Right Side) -->
  <g transform="translate(350, 180) rotate(-10)">
    <rect x="0" y="0" width="80" height="95" rx="12" fill="#0A5C4F" />
    <rect x="6" y="8" width="68" height="79" rx="8" fill="#149E86" />
    <line x1="20" y1="20" x2="60" y2="20" stroke="#E0F3EC" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="35" x2="50" y2="35" stroke="#E0F3EC" stroke-width="3" stroke-linecap="round" />
    <!-- Velcro strap indicator -->
    <rect x="60" y="20" width="22" height="40" rx="4" fill="#0A5C4F" stroke="#75BCA5" stroke-width="2" />
  </g>

  <!-- Left: Medical Stethoscope -->
  <g transform="translate(50, 85)">
    <!-- Curving Tubes -->
    <path d="M 60 70 C 40 40, 75 25, 90 40" stroke="#75BCA5" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 100 70 C 120 40, 85 25, 70 40" stroke="#75BCA5" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="58" cy="74" r="3.5" fill="#0A5C4F" />
    <circle cx="102" cy="74" r="3.5" fill="#0A5C4F" />
    
    <!-- Y-Junction & Main Tube -->
    <path d="M 80 50 L 80 85 C 80 145, 15 150, 25 210 C 35 250, 95 240, 115 195 L 125 180" stroke="#0A5C4F" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Chest Piece -->
    <circle cx="132" cy="172" r="18" fill="#75BCA5" stroke="#0A5C4F" stroke-width="3.5" />
    <circle cx="132" cy="172" r="9" fill="#E0F3EC" />
  </g>

  <!-- Top Right: Vital Health Heart / Wellness Badge -->
  <g transform="translate(360, 45)">
    <circle cx="30" cy="30" r="28" fill="#FFFFFF" stroke="#A9DCCB" stroke-width="2" />
    <circle cx="30" cy="30" r="24" fill="#E8F6F1" />
    <path d="M 30 20 C 30 20, 24 13, 18 17 C 12 21, 12 29, 30 42 C 48 29, 48 21, 42 17 C 36 13, 30 20, 30 20 Z" fill="#149E86" />
    <!-- Pulse Line across Heart -->
    <path d="M 20 28 L 26 28 L 29 23 L 33 33 L 36 26 L 40 28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
