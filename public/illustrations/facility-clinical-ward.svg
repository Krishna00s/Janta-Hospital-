<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <!-- Soft Mint Backdrop Card -->
  <rect x="15" y="15" width="470" height="320" rx="28" fill="#EBF6F2" stroke="#D1E8DF" stroke-width="2" />
  
  <!-- Subtle Organic Wave in Background -->
  <path d="M 15 250 C 130 200, 240 270, 360 215 C 410 190, 450 215, 485 205 L 485 335 L 15 335 Z" fill="#E0F3EC" opacity="0.7" />

  <!-- Background Clean Ward Window / Morning Light -->
  <g transform="translate(190, 45)" opacity="0.45">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <line x1="60" y1="0" x2="60" y2="90" stroke="#0A5C4F" stroke-width="2" />
    <line x1="0" y1="45" x2="120" y2="45" stroke="#0A5C4F" stroke-width="2" />
    <!-- Warm sunrise glow -->
    <path d="M 10 80 L 110 80 C 110 50, 10 50, 10 80 Z" fill="#D2EAE1" />
  </g>

  <!-- Left: IV Drip Infusion Stand -->
  <g transform="translate(60, 50)">
    <!-- Stand Pole -->
    <rect x="35" y="40" width="5" height="230" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="2" />
    <!-- Wheeled Base -->
    <ellipse cx="37" cy="270" rx="28" ry="7" fill="#0A5C4F" opacity="0.15" />
    <path d="M 12 268 L 62 268" stroke="#0A5C4F" stroke-width="4" stroke-linecap="round" />

    <!-- Top Double Hook -->
    <path d="M 18 35 C 18 20, 37 20, 37 35 C 37 20, 56 20, 56 35" stroke="#0A5C4F" stroke-width="3" fill="none" />
    
    <!-- IV Saline Solution Bag -->
    <rect x="23" y="38" width="28" height="50" rx="7" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    <!-- Liquid Level inside -->
    <rect x="25" y="52" width="24" height="34" rx="4" fill="#7CE4C9" opacity="0.4" />
    <line x1="26" y1="60" x2="34" y2="60" stroke="#0A5C4F" stroke-width="1.5" />
    <line x1="26" y1="68" x2="38" y2="68" stroke="#0A5C4F" stroke-width="1.5" />
    <line x1="26" y1="76" x2="32" y2="76" stroke="#0A5C4F" stroke-width="1.5" />
    <!-- Drip Chamber & Tube -->
    <rect x="34" y="88" width="6" height="15" rx="2" fill="#E0F3EC" stroke="#0A5C4F" stroke-width="1.5" />
    <path d="M 37 103 C 37 140, 75 160, 110 170" stroke="#75BCA5" stroke-width="2.5" fill="none" />
  </g>

  <!-- Centerpiece: Patient Care Ward Bed -->
  <g transform="translate(130, 140)">
    <!-- Bed Shadow -->
    <ellipse cx="140" cy="165" rx="140" ry="14" fill="#0A5C4F" opacity="0.12" />

    <!-- Headboard & Footboard Frame -->
    <rect x="20" y="20" width="8" height="135" rx="4" fill="#0A5C4F" />
    <rect x="250" y="50" width="8" height="105" rx="4" fill="#0A5C4F" />
    
    <!-- Bed Base Frame -->
    <rect x="20" y="85" width="238" height="22" rx="4" fill="#A9DCCB" stroke="#0A5C4F" stroke-width="2.5" />
    
    <!-- Mattress Cushion -->
    <rect x="28" y="70" width="222" height="22" rx="5" fill="#FFFFFF" stroke="#C0DBD1" stroke-width="2" />

    <!-- Folded Blanket (Deep Teal & Mint) -->
    <path d="M 85 70 L 246 70 C 248 70, 250 72, 250 75 L 250 92 L 85 92 Z" fill="#0D7A68" />
    <path d="M 85 70 L 105 70 L 105 92 L 85 92 Z" fill="#149E86" />

    <!-- Soft White Pillows -->
    <g transform="translate(32, 48)">
      <rect x="0" y="0" width="45" height="24" rx="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
      <rect x="6" y="-8" width="45" height="24" rx="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2" />
    </g>

    <!-- Side Safety Rail -->
    <path d="M 90 60 L 190 60 L 190 85 M 90 85 L 90 60 M 125 60 L 125 85 M 155 60 L 155 85" stroke="#75BCA5" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right: Bedside Cabinet & Medical Care Items -->
  <g transform="translate(390, 165)">
    <!-- Cabinet Shadow -->
    <ellipse cx="35" cy="140" rx="35" ry="8" fill="#0A5C4F" opacity="0.12" />

    <!-- Main Cabinet Unit -->
    <rect x="5" y="30" width="60" height="105" rx="8" fill="#FFFFFF" stroke="#0A5C4F" stroke-width="2.5" />
    <!-- Top Drawer -->
    <rect x="12" y="38" width="46" height="25" rx="4" fill="#F4FAF7" stroke="#A9DCCB" stroke-width="1.5" />
    <circle cx="35" cy="50" r="3" fill="#0A5C4F" />
    <!-- Bottom Door -->
    <rect x="12" y="70" width="46" height="55" rx="4" fill="#F4FAF7" stroke="#A9DCCB" stroke-width="1.5" />
    <line x1="50" y1="92" x2="50" y2="102" stroke="#0A5C4F" stroke-width="2" stroke-linecap="round" />

    <!-- Water Carafe & Glass on Top of Cabinet -->
    <g transform="translate(18, 5)">
      <rect x="0" y="8" width="16" height="17" rx="3" fill="#E8F6F1" stroke="#0A5C4F" stroke-width="1.5" />
      <rect x="22" y="13" width="10" height="12" rx="2" fill="#E8F6F1" stroke="#0A5C4F" stroke-width="1.5" />
    </g>
  </g>
</svg>
